services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zhidao-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - zhidao-db-data:/app/data
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      # Clear any host proxy variables injected by Docker Desktop on Windows.
      # When a VPN (e.g. Clash) is active, Docker Desktop may inject
      # HTTP_PROXY=http://127.0.0.1:7890 into containers. That address is
      # unreachable inside the container, breaking outbound requests.
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - NO_PROXY=*
      - no_proxy=*

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zhidao-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  zhidao-db-data:
