services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zhidao-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - zhidao-db-data:/app/data
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zhidao-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  zhidao-db-data:
